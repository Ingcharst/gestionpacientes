<!-- Widget de Alerta de Pacientes Sin Grupo -->
{% if pacientes_sin_grupo > 0 %}
<div class="alert alert-warning border-0 shadow-sm mb-4" role="alert">
    <div class="d-flex align-items-center">
        <div class="bg-warning bg-opacity-10 p-3 rounded me-3">
            <i class="bi bi-exclamation-triangle-fill text-warning fs-3"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="alert-heading mb-1 fw-bold">
                <i class="bi bi-clock-history me-2"></i>Pacientes Pendientes de Asignación
            </h6>
            <p class="mb-2">
                Hay <strong>{{ pacientes_sin_grupo }}</strong> paciente(s) en lista de espera sin grupo asignado.
                {% if pacientes_urgentes > 0 %}
                <span class="badge bg-danger ms-2">
                    {{ pacientes_urgentes }} prioridad alta
                </span>
                {% endif %}
            </p>
            <div class="d-flex gap-2">
                <a href="{% url 'grupos:pacientes_pendientes' %}" class="btn btn-sm btn-warning">
                    <i class="bi bi-list-ul me-1"></i>Ver Lista de Espera
                </a>
                <a href="{% url 'grupos:grupo_list' %}" class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-people me-1"></i>Ver Grupos Disponibles
                </a>
            </div>
        </div>
    </div>
</div>
{% endif %}
