{% extends 'base/base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="alert alert-warning">
        <h4>Alerta: Sobrecupo en {{ alerta.grupo.nombre }}</h4>
        <p>Debe reasignar {{ alerta.pacientes_excedentes }} paciente(s)</p>
    </div>
    <form method="post">
        {% csrf_token %}
        {% for asig in pacientes_afectados %}
        <div class="card mb-2">
            <div class="card-body">
                <strong>{{ asig.paciente.nombre_completo }}</strong>
                <select name="grupo_{{ asig.id }}" class="form-select mt-2">
                    <option value="">Seleccionar grupo...</option>
                    {% for g in grupos_disponibles %}
                    <option value="{{ g.id }}">{{ g.nombre }} ({{ g.cupos_disponibles }} cupos)</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary mt-3">Reasignar</button>
    </form>
</div>
{% endblock %}
