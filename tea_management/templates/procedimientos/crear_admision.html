{% extends 'base/base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="card">
        <div class="card-header">
            <h4>Nueva Admisión - {{ paciente.nombre_completo }}</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">Crear</button>
                <a href="{% url 'procedimientos:admisiones_paciente' pk=paciente.id %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
