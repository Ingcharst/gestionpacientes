{% extends 'base/base.html' %}

{% block title %}Pacientes - VIDAMED Salud Integral{% endblock %}
{% block page_title %}Gestión de Pacientes{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Lista de Pacientes</h5>
        <!--a href="{% url 'procedimientos:paciente_create' %}" class="btn btn-primary"-->
        <a href="{% url 'procedimientos:registrar_paciente' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Paciente
        </a>
    </div>
    
    <div class="card-body">
        <!-- Filtros -->
        <div class="row mb-4">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Buscar por nombre o documento..."
                       hx-get="{% url 'procedimientos:paciente_list' %}" 
                       hx-trigger="keyup changed delay:500ms" 
                       hx-target="#pacientes-table"
                       name="search">
            </div>
            <div class="col-md-3">
                <select class="form-select" 
                        hx-get="{% url 'procedimientos:paciente_list' %}"
                        hx-trigger="change"
                        hx-target="#pacientes-table"
                        name="estado">
                    <option value="">Todos los estados</option>
                    <option value="ACTIVO">Activos</option>
                    <option value="INACTIVO">Inactivos</option>
                    <option value="SUSPENDIDO">Suspendidos</option>
                </select>
            </div>
        </div>
        
        <!-- Tabla -->
        <div id="pacientes-table">
            {% include 'pacientes/table.html' %}
        </div>
    </div>
</div>
{% endblock %}
