{% extends 'base/base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="card">
        <div class="card-header"><h4>Verificar Inasistencias</h4></div>
        <div class="card-body">
            <p>Ejecutar verificación manual de inasistencias</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Verificar Ahora</button>
                <a href="{% url 'alertas:dashboard_alertas' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
