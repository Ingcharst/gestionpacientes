{% extends 'base/base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="card">
        <div class="card-header">
            <h4>Atender Alerta - {{ alerta.paciente.nombre_completo }}</h4>
        </div>
        <div class="card-body">
            <p><strong>Días:</strong> {{ alerta.dias_consecutivos }}</p>
            <p><strong>Teléfono:</strong> {{ alerta.telefono_destino }}</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Observaciones:</label>
                    <textarea name="observaciones" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Marcar Atendida</button>
                <a href="{% url 'alertas:dashboard_alertas' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
